[project]
name = "comfyui-editfence"
version = "0.1.0"
description = "Inspect aligned image edits against allowed/protected regions and restore original protected pixels."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "A ad钙"}]
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.urls]
Repository = "https://github.com/Ye-Zayne/comfyui-editfence"
"Bug Tracker" = "https://github.com/Ye-Zayne/comfyui-editfence/issues"

[tool.comfy]
PublisherId = "jinny-wj"
DisplayName = "EditFence"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
